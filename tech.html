<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>생명기술과 지속가능한 발전 (BioTech Quest)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bio-green': '#10B981',
                        'bio-dark': '#064E3B',
                        'bio-light': '#D1FAE5',
                        'bio-blue': '#0284C7',
                        'bio-accent': '#F59E0B',
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #064e3b 50%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        #app-container {
            width: 100vw;
            height: 100vh;
            max-width: 1180px;
            max-height: 820px;
            aspect-ratio: 4 / 3;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.5);
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .stage-badge {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .touch-btn {
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .touch-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="p-2 sm:p-4">

    <!-- App Container -->
    <div id="app-container" class="relative flex flex-col justify-between p-6">
        
        <!-- HEADER -->
        <header id="main-header" class="flex justify-between items-center pb-4 border-b border-emerald-200">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-lg text-2xl">
                    <i class="fa-solid font-bold fa-leaf"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                        <span>생명기술 & 지속가능한 발전</span>
                        <span id="difficulty-tag" class="hidden text-xs px-2.5 py-0.5 bg-amber-500 text-white font-bold rounded-full animate-pulse">🔥 마스터 모드</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">중학교 3학년 기술 교과 연계 스마트 탐구 퀘스트</p>
                </div>
            </div>

            <div id="header-stats" class="hidden flex items-center gap-4">
                <div class="bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 flex items-center gap-2">
                    <span id="player-avatar-icon" class="text-emerald-600 text-lg"><i class="fa-solid fa-user-astronaut"></i></span>
                    <div>
                        <div id="player-display-info" class="text-xs font-bold text-slate-700">학생 정보</div>
                        <div id="player-display-role" class="text-[10px] text-emerald-600 font-semibold">탐구 연구원</div>
                    </div>
                </div>

                <div class="bg-amber-50 px-4 py-1.5 rounded-xl border border-amber-200 flex items-center gap-3">
                    <div class="text-center">
                        <div class="text-[10px] text-amber-700 font-semibold">ECO SCORE</div>
                        <div id="score-display" class="text-lg font-black text-amber-600 leading-none">0</div>
                    </div>
                    <div class="text-center border-l border-amber-200 pl-3">
                        <div class="text-[10px] text-amber-700 font-semibold">COMBO</div>
                        <div id="combo-display" class="text-lg font-black text-emerald-600 leading-none">0x</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN VIEWPORT CONTENT -->
        <main id="main-content" class="flex-1 my-4 relative overflow-y-auto pr-1">
            <!-- Screen 1: Start & Student Setup View -->
            <div id="view-setup" class="h-full flex flex-col justify-center items-center">
                <div class="w-full max-w-2xl bg-white/80 rounded-3xl p-8 border border-emerald-100 shadow-xl backdrop-blur-md">
                    <div class="text-center mb-6">
                        <span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold tracking-wide uppercase">Interactive Learning Quest</span>
                        <h2 class="text-2xl font-black text-slate-800 mt-2">미래를 바꾸는 생명기술 대탐험</h2>
                        <p class="text-sm text-slate-600 mt-1">이름과 역할을 선택하고 지속 가능한 지구를 위한 미션을 해결하세요!</p>
                    </div>

                    <form id="form-setup" onsubmit="startGame(event)" class="space-y-5">
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">학년 / 반</label>
                                <input type="text" id="input-class" required placeholder="3학년 1반" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">번호</label>
                                <input type="number" id="input-number" required placeholder="12" min="1" max="50" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">이름</label>
                                <input type="text" id="input-name" required placeholder="김기술" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-semibold">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-2">탐구 연구원 역할 선택</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label class="role-option cursor-pointer">
                                    <input type="radio" name="role" value="researcher" checked class="peer hidden">
                                    <div class="p-3 rounded-2xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/70 text-center transition-all flex flex-col items-center gap-1.5">
                                        <i class="fa-solid fa-microscope text-2xl text-emerald-600"></i>
                                        <span class="text-xs font-bold text-slate-800">생명공학 연구원</span>
                                        <span class="text-[10px] text-slate-500 leading-tight">유전자재조합 & 의약품</span>
                                    </div>
                                </label>
                                <label class="role-option cursor-pointer">
                                    <input type="radio" name="role" value="smartfarm" class="peer hidden">
                                    <div class="p-3 rounded-2xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/70 text-center transition-all flex flex-col items-center gap-1.5">
                                        <i class="fa-solid fa-wheat-awn text-2xl text-amber-500"></i>
                                        <span class="text-xs font-bold text-slate-800">스마트팜 전문가</span>
                                        <span class="text-[10px] text-slate-500 leading-tight">IoT 제어 & 정밀농업</span>
                                    </div>
                                </label>
                                <label class="role-option cursor-pointer">
                                    <input type="radio" name="role" value="ecodev" class="peer hidden">
                                    <div class="p-3 rounded-2xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/70 text-center transition-all flex flex-col items-center gap-1.5">
                                        <i class="fa-solid fa-recycle text-2xl text-teal-600"></i>
                                        <span class="text-xs font-bold text-slate-800">친환경 소재 개발자</span>
                                        <span class="text-[10px] text-slate-500 leading-tight">바이오플라스틱 & 에너지</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="touch-btn w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 text-base flex items-center justify-center gap-2">
                            <span>탐구 미션 시작하기</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Stage Canvas Area -->
            <div id="stage-canvas" class="hidden h-full flex flex-col"></div>

            <!-- Result Screen -->
            <div id="view-result" class="hidden h-full flex flex-col items-center justify-center"></div>
        </main>

        <!-- FOOTER / PROGRESS STEPPER BAR -->
        <footer id="main-footer" class="hidden border-t border-slate-200 pt-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div id="step-1" class="stage-badge px-3 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span>1. 생명기술 구분</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                <div id="step-2" class="stage-badge px-3 py-1 bg-slate-100 text-slate-400 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span>2. 스마트팜 제어</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                <div id="step-3" class="stage-badge px-3 py-1 bg-slate-100 text-slate-400 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span>3. 바이오에너지 공정</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                <div id="step-4" class="stage-badge px-3 py-1 bg-slate-100 text-slate-400 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span>4. 지속가능성 & 윤리</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleAudio()" id="btn-sound" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold flex items-center gap-1">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div id="timer-box" class="px-3 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-mono font-bold flex items-center gap-1">
                    <i class="fa-solid fa-stopwatch text-amber-400"></i>
                    <span id="timer-text">00:00</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- MODAL POPUP -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100 transform transition-all scale-95 opacity-0" id="modal-card">
            <div class="text-center">
                <div id="modal-icon" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3"></div>
                <h3 id="modal-title" class="text-xl font-bold text-slate-800"></h3>
                <p id="modal-body" class="text-sm text-slate-600 mt-2 leading-relaxed"></p>
                <button onclick="closeModal()" class="touch-btn mt-5 w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md">
                    확인 및 다음
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const state = {
            player: { classInfo: '', number: '', name: '', role: 'researcher' },
            currentStage: 1,
            score: 0,
            combo: 0,
            isMasterMode: false,
            startTime: 0,
            timerInterval: null,
            elapsedSeconds: 0,
            soundEnabled: true,
            
            stage1Cards: [],
            stage1Sorted: { traditional: [], modern: [] },

            stage2Targets: { temp: 22, humidity: 65, led: "red", co2: 800 },
            stage2Current: { temp: 15, humidity: 40, led: "white", co2: 400 },

            stage3Steps: [
                { step: 1, name: "바이오매스 수집", desc: "옥수수, 사탕수수, 미세조류 수확", icon: "fa-wheat-field" },
                { step: 2, name: "당화 및 미생물 발효", desc: "효소로 당을 분해하고 효모로 발효", icon: "fa-flask-vial" },
                { step: 3, name: "증류 및 정제", desc: "고순도 바이오에탄올 추출", icon: "fa-filter" },
                { step: 4, name: "수송 및 탄소중립 활용", desc: "화석연료 대체 및 CO2 순환", icon: "fa-gas-pump" }
            ],
            stage3UserOrder: [],

            stage4CurrentIdx: 0,
            stage4Questions: []
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!state.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(130, now + 0.2);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'levelup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('btn-sound');
            if (state.soundEnabled) {
                btn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
                btn.classList.replace('text-slate-400', 'text-slate-700');
            } else {
                btn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i>`;
                btn.classList.replace('text-slate-700', 'text-slate-400');
            }
        }

        function startTimer() {
            state.startTime = Date.now();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
                const mins = String(Math.floor(state.elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(state.elapsedSeconds % 60).padStart(2, '0');
                document.getElementById('timer-text').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function addScore(points) {
            state.combo += 1;
            const comboBonus = Math.floor(points * (state.combo * 0.1));
            const total = points + comboBonus;
            state.score += total;
            
            document.getElementById('score-display').innerText = state.score;
            document.getElementById('combo-display').innerText = `${state.combo}x`;
            playSound('success');
        }

        function resetCombo() {
            state.combo = 0;
            document.getElementById('combo-display').innerText = `0x`;
            playSound('wrong');
        }

        function initData() {
            // Stage 1 Cards
            if (state.isMasterMode) {
                state.stage1Cards = [
                    { id: 1, title: "김치 & 된장 발효", category: "traditional", desc: "자연 미생물 발효", icon: "fa-jar" },
                    { id: 2, title: "유전자 재조합(GMO)", category: "modern", desc: "표적 유전자 삽입", icon: "fa-dna" },
                    { id: 3, title: "전통주 발효", category: "traditional", desc: "효모 이용 알코올 발효", icon: "fa-wine-bottle" },
                    { id: 4, title: "줄기세포 조직 배양", category: "modern", desc: "장기 재생 기술", icon: "fa-vial" },
                    { id: 5, title: "유전자 가위(CRISPR)", category: "modern", desc: "특정 DNA 교정", icon: "fa-scissors" },
                    { id: 6, title: "퇴비화 천연비료", category: "traditional", desc: "유기물 자연 분해", icon: "fa-seedling" },
                    { id: 7, title: "체외 수정 & 수정란 이식", category: "modern", desc: "우수 품종 가축 번식", icon: "fa-baby" },
                    { id: 8, title: "접붙이기(접목)", category: "traditional", desc: "전통 식물 번식법", icon: "fa-tree" }
                ];
            } else {
                state.stage1Cards = [
                    { id: 1, title: "김치 & 된장 발효", category: "traditional", desc: "자연 미생물 발효", icon: "fa-jar" },
                    { id: 2, title: "유전자 재조합 기술", category: "modern", desc: "인슐린 다량 생산", icon: "fa-dna" },
                    { id: 3, title: "전통주 발효", category: "traditional", desc: "효모 이용 발효", icon: "fa-wine-bottle" },
                    { id: 4, title: "줄기세포 조직 배양", category: "modern", desc: "장기 및 세포 재생", icon: "fa-vial" },
                    { id: 5, title: "우수 품종 선택 교배", category: "traditional", desc: "전통 인공선발법", icon: "fa-cow" },
                    { id: 6, title: "동물 복제 기술", category: "modern", desc: "체세포 복제 동물", icon: "fa-clone" }
                ];
            }

            // Stage 2 Targets
            if (state.isMasterMode) {
                state.stage2Targets = { temp: 23, humidity: 68, led: "red", co2: 1000 };
            } else {
                state.stage2Targets = { temp: 22, humidity: 65, led: "red", co2: 800 };
            }

            // Stage 4 Questions
            if (state.isMasterMode) {
                state.stage4Questions = [
                    {
                        title: "마스터 시나리오 1: 유전자 가위(CRISPR) 규제 완화",
                        desc: "외부 DNA를 넣지 않고 자체 유전자만 교정하는 유전자 가위 작물을 GMO 규제에서 제외할 것인가?",
                        options: [
                            { text: "규제 완화: 기후위기 대응 신속한 신품종 개발 지원", score: 35, eco: "+30 기술혁신", note: "신속한 기후위기 대응 작물 확보가 가능해지지만, 생태계 영향에 대한 장기 모니터링이 필요합니다." },
                            { text: "동일 규제 유지: 안전성 검증 후 신중한 상용화", score: 20, eco: "+15 소비자안전", note: "안전성은 극대화되나 글로벌 기술 경쟁 및 식량 문제 대응이 늦어질 수 있습니다." }
                        ]
                    },
                    {
                        title: "마스터 시나리오 2: 배양육(Lab-grown Meat) 상용화",
                        desc: "가축 사육 없이 세포 배양으로 만든 배양육을 전통 축산업 대체재로 대규모 보급할 것인가?",
                        options: [

        function startGame(e) {
            e.preventDefault();
            playSound('click');

            state.player.classInfo = document.getElementById('input-class').value;
            state.player.number = document.getElementById('input-number').value;
            state.player.name = document.getElementById('input-name').value;
            
            const roles = document.getElementsByName('role');
            for (let r of roles) {
                if (r.checked) state.player.role = r.value;
            }

            document.getElementById('player-display-info').innerText = `${state.player.name} (${state.player.classInfo} ${state.player.number}번)`;
            
            let roleTitle = "생명공학 연구원";
            let roleIcon = "fa-microscope";
            if (state.player.role === 'smartfarm') {
                roleTitle = "스마트팜 전문가";
                roleIcon = "fa-wheat-awn";
            } else if (state.player.role === 'ecodev') {
                roleTitle = "친환경 소재 개발자";
                roleIcon = "fa-recycle";
            }

            document.getElementById('player-display-role').innerText = roleTitle;
            document.getElementById('player-avatar-icon').innerHTML = `<i class="fa-solid ${roleIcon}"></i>`;

            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('header-stats').classList.remove('hidden');
            document.getElementById('stage-canvas').classList.remove('hidden');
            document.getElementById('main-footer').classList.remove('hidden');

            initData();
            startTimer();
            loadStage(1);
        }

        function updateStepper() {
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`step-${i}`);
                if (i === state.currentStage) {
                    el.className = "stage-badge px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-md scale-105";
                } else if (i < state.currentStage) {
                    el.className = "stage-badge px-3 py-1 bg-emerald-100 text-emerald-800 rounded-lg text-xs font-bold flex items-center gap-1 opacity-80";
                } else {
                    el.className = "stage-badge px-3 py-1 bg-slate-100 text-slate-400 rounded-lg text-xs font-bold flex items-center gap-1";
                }
            }
        }

        function loadStage(stageNum) {
            state.currentStage = stageNum;
            updateStepper();
            const canvas = document.getElementById('stage-canvas');
            canvas.innerHTML = '';

            if (stageNum === 1) renderStage1(canvas);
            else if (stageNum === 2) renderStage2(canvas);
            else if (stageNum === 3) renderStage3(canvas);
            else if (stageNum === 4) renderStage4(canvas);
        }

        let selectedCardId = null;

        function selectCard(id) {
            playSound('click');
            selectedCardId = id;
            document.querySelectorAll('#cards-pool > div').forEach(el => {
                el.classList.remove('ring-2', 'ring-emerald-500', 'bg-emerald-100');
            });
            const cardEl = document.getElementById(`card-${id}`);
            if (cardEl) {
                cardEl.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-100');
            }
        }

        function dropSelectedCard(targetCategory) {
            if (!selectedCardId) {
                showModal("카드 선택 필요", "상단의 기술 카드를 먼저 터치하여 선택한 후 분류 구역을 눌러주세요.", "info");
                return;
            }

            const card = state.stage1Cards.find(c => c.id === selectedCardId);
            if (!card) return;

            if (card.category === targetCategory) {
                addScore(50);
                showModal("정답입니다! 🎉", `<b>${card.title}</b>은(는) <b>${targetCategory === 'traditional' ? '전통 생명기술' : '현대 생명기술'}</b>에 해당합니다.`, "success");

                state.stage1Cards = state.stage1Cards.filter(c => c.id !== selectedCardId);
                selectedCardId = null;

                if (state.stage1Cards.length === 0) {
                    setTimeout(() => {
                        playSound('levelup');
                        showModal("Stage 1 완료!", "전통 및 현대 생명기술의 분류 미션을 완수했습니다.<br>다음 스마트팜 미션으로 이동합니다.", "success");

            }
        }

                    </div>

                    <div class="grid grid-cols-12 gap-3 my-1 flex-1">

        function updateSmartFarm(type, val) {
            playSound('click');
            if (type === 'temp') {
                state.stage2Current.temp = parseInt(val);
                document.getElementById('val-temp').innerText = `${val}°C`;
                document.getElementById('cur-temp').innerText = `${val}°C`;
            } else if (type === 'humidity') {
                state.stage2Current.humidity = parseInt(val);
                document.getElementById('val-humid').innerText = `${val}%`;
                document.getElementById('cur-humid').innerText = `${val}%`;
            } else if (type === 'co2') {
                state.stage2Current.co2 = parseInt(val);
                const valCo2 = document.getElementById('val-co2');
                const curCo2 = document.getElementById('cur-co2');
                if (valCo2) valCo2.innerText = `${val}ppm`;
                if (curCo2) curCo2.innerText = `${val}`;
            } else if (type === 'led') {
                state.stage2Current.led = val;
                document.getElementById('cur-led').innerText = val.toUpperCase();
                const lightOverlay = document.getElementById('led-light-overlay');
                if (val === 'red') lightOverlay.className = "absolute inset-0 opacity-30 pointer-events-none transition-all duration-500 bg-red-500";
                else if (val === 'blue') lightOverlay.className = "absolute inset-0 opacity-30 pointer-events-none transition-all duration-500 bg-blue-500";
                else lightOverlay.className = "absolute inset-0 opacity-10 pointer-events-none transition-all duration-500 bg-yellow-200";
            }
            calculateHealth();
        }

        function calculateHealth() {
            const targets = state.stage2Targets;
            let score = 100;
            
            const tempDiff = Math.abs(state.stage2Current.temp - targets.temp);
            const humidDiff = Math.abs(state.stage2Current.humidity - targets.humidity);
            
            score -= tempDiff * 5;
            score -= humidDiff * 2;
            if (state.stage2Current.led !== 'red') score -= 20;

            if (state.isMasterMode) {
                const co2Diff = Math.abs(state.stage2Current.co2 - targets.co2);
                score -= Math.floor(co2Diff / 50) * 3;
            }

            score = Math.max(10, Math.min(100, score));

            const healthEl = document.getElementById('health-pct');
            const cropIcon = document.getElementById('crop-icon');
            if (healthEl) healthEl.innerText = `${score}%`;

            if (cropIcon) {
                if (score >= 85) {
                    cropIcon.className = "text-5xl text-emerald-600 transition-all transform duration-300 scale-125";
                    cropIcon.innerHTML = `<i class="fa-solid fa-wheat-awn text-amber-500"></i>`;
                } else {
                    cropIcon.className = "text-5xl text-emerald-600 transition-all transform duration-300 scale-90";
                    cropIcon.innerHTML = `<i class="fa-solid fa-seedling text-emerald-600"></i>`;
                }
            }
            return score;
        }

        function checkSmartFarmSuccess() {
            const health = calculateHealth();
            if (health >= 85) {
                addScore(100);
                playSound('levelup');
                showModal("스마트팜 최적 제어 성공! 🌾", "스마트 센서 및 자동 환경제어로 최고의 생육 적정도를 달성했습니다.<br><b>생산량이 대폭 증가했습니다!</b>", "success");
                setTimeout(() => loadStage(3), 1000);
            } else {
                resetCombo();
                showModal("생육 조건 불균형!", `현재 적정도(${health}%)가 낮습니다. 목표 목표치(온도 ${state.stage2Targets.temp}°C, 습도 ${state.stage2Targets.humidity}%, 적색광 LED${state.isMasterMode ? `, CO2 ${state.stage2Targets.co2}ppm` : ''})에 맞춰보세요.`, "error");
            }
        }

            container.innerHTML = `
                <div class="flex-1 flex flex-col justify-between">
                    <div class="bg-emerald-50/60 p-3.5 rounded-2xl border border-emerald-100 mb-2">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <span class="w-6 h-6 bg-emerald-600 text-white text-xs rounded-full flex items-center justify-center font-black">3</span>
                            <span>바이오 에탄올(Bioethanol) 생산 공정 순서 맞추기</span>
                        </h3>
                        <p class="text-xs text-slate-600 mt-0.5">바이오매스로부터 친환경 탄소중립 바이오 연료를 만드는 올바른 순서를 선택하세요.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3 my-auto flex-1">
                        <div class="space-y-2">
                            <div class="text-xs font-bold text-slate-600 mb-1">선택할 공정 단계</div>
                            ${steps.map(s => `
                                <div id="bio-step-${s.step}" onclick="addBioStep(${s.step})" class="glass-card p-2.5 rounded-xl border border-slate-200 cursor-pointer hover:border-emerald-500 transition-all flex items-center justify-between">
                                    <div class="flex items-center gap-2.5">
                                        <div class="w-8 h-8 rounded-lg bg-teal-100 text-teal-700 flex items-center justify-center text-sm shrink-0">
                                            <i class="fa-solid ${s.icon}"></i>
                                        </div>
                                        <div>
                                            <div class="text-xs font-bold text-slate-800">${s.name}</div>
                                            <div class="text-[10px] text-slate-500">${s.desc}</div>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-plus text-slate-400 text-xs"></i>
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-slate-800 p-3.5 rounded-2xl text-white flex flex-col justify-between">
                            <div>
                                <div class="text-xs font-bold text-amber-400 mb-2 flex items-center justify-between">
                                    <span><i class="fa-solid fa-timeline"></i> 구축된 바이오 연료 생산 라인</span>
                                    <button onclick="resetBioSteps()" class="text-[10px] text-slate-300 underline">초기화</button>
                                </div>
                                <div id="bio-timeline" class="space-y-1.5 min-h-[160px]">
                                    <div class="text-xs text-slate-400 text-center py-8">왼쪽 항목을 순서대로 터치하세요.</div>
                                </div>
                            </div>

                            <button onclick="verifyBioSequence()" class="touch-btn w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs sm:text-sm mt-2">
                                공정 가동 및 친환경 연료 생산 테스트
                            </button>
                        </div>
                    </div>
                </div>
            `;
            state.stage3UserOrder = [];
        }

        function addBioStep(stepNum) {
            if (state.stage3UserOrder.includes(stepNum)) return;
            playSound('click');
            state.stage3UserOrder.push(stepNum);

            const cardEl = document.getElementById(`bio-step-${stepNum}`);
            if (cardEl) cardEl.classList.add('opacity-40', 'pointer-events-none');

            renderBioTimeline();
        }

        function resetBioSteps() {
            playSound('click');
            state.stage3UserOrder = [];
            state.stage3Steps.forEach(s => {
                const cardEl = document.getElementById(`bio-step-${s.step}`);
                if (cardEl) cardEl.classList.remove('opacity-40', 'pointer-events-none');
            });
            renderBioTimeline();
        }

        function renderBioTimeline() {
            const timelineEl = document.getElementById('bio-timeline');
            if (!timelineEl) return;

            if (state.stage3UserOrder.length === 0) {
                timelineEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-8">왼쪽 항목을 순서대로 터치하세요.</div>`;
                return;
            }

            timelineEl.innerHTML = state.stage3UserOrder.map((stepNum, idx) => {
                const stepObj = state.stage3Steps.find(s => s.step === stepNum);
                return `
                    <div class="bg-slate-700/80 p-2 rounded-xl border border-slate-600 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <span class="w-4 h-4 bg-amber-500 text-slate-900 rounded-full flex items-center justify-center font-bold text-[9px]">${idx + 1}</span>
                            <span class="font-bold text-white">${stepObj.name}</span>
                        </div>
                        <i class="fa-solid ${stepObj.icon} text-emerald-400"></i>
                    </div>
                `;
            }).join('');
        }

        function verifyBioSequence() {
            if (state.stage3UserOrder.length < 4) {
                showModal("공정 미완성", "4가지 공정을 순서대로 모두 배치해 주어야 합니다.", "info");
                return;
            }

            const isCorrect = state.stage3UserOrder.every((val, index) => val === index + 1);

            if (isCorrect) {
                addScore(100);
                playSound('levelup');
                showModal("바이오 에탄올 생산 성공! ⛽", "<b>바이오매스 수집 ➔ 당화/발효 ➔ 정제 ➔ 수송 및 탄소중립 활용</b> 공정이 완료되었습니다.<br>연소 시 배출되는 탄소가 식물 성장 과정에서 재흡수되는 <b>탄소중립 순환 체계</b>를 형성합니다.", "success");
                setTimeout(() => loadStage(4), 1000);
            } else {
                resetCombo();
                showModal("공정 오류!", "순서가 맞지 않아 바이오 에탄올 정제에 실패했습니다.<br><b>수집 ➔ 발효 ➔ 정제 ➔ 활용</b> 순서로 재시도하세요.", "error");
                resetBioSteps();
            }
        }

        // ==========================================
        // STAGE 4: Bioethics & SDGs Dilemma
        // ==========================================
        function renderStage4(container) {
            const scenario = state.stage4Questions[state.stage4CurrentIdx];

            container.innerHTML = `
                <div class="flex-1 flex flex-col justify-between">
                    <div class="bg-emerald-50/60 p-3.5 rounded-2xl border border-emerald-100 mb-2">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <span class="w-6 h-6 bg-emerald-600 text-white text-xs rounded-full flex items-center justify-center font-black">4</span>
                            <span>지속가능한 발전(SDGs) & 생명윤리 토론 의사결정</span>
                        </h3>
                        <p class="text-xs text-slate-600 mt-0.5">생명기술 발전과 사회적, 환경적 가치 간의 균형을 고려하여 최선의 결정을 내리세요.</p>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-md my-auto space-y-3">
                        <div class="flex items-center gap-2 text-xs font-bold text-emerald-600">
                            <i class="fa-solid fa-scale-balanced"></i>
                            <span>의사결정 시나리오 (${state.stage4CurrentIdx + 1} / ${state.stage4Questions.length})</span>
                        </div>

                        <h4 class="text-sm sm:text-base font-black text-slate-800">${scenario.title}</h4>
                        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${scenario.desc}</p>

                        <div class="space-y-2.5 pt-1">
                            ${scenario.options.map((opt, i) => `
                                <button onclick="chooseDilemmaOption(${i})" class="touch-btn w-full p-3.5 rounded-2xl border-2 border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 text-left transition-all flex items-start justify-between">
                                    <div>
                                        <div class="text-xs sm:text-sm font-bold text-slate-800 mb-0.5">${opt.text}</div>
                                        <div class="text-[10px] sm:text-xs text-slate-500">${opt.note}</div>
                                    </div>
                                    <span class="text-[10px] sm:text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-lg shrink-0 ml-2">${opt.eco}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function chooseDilemmaOption(optIdx) {
            playSound('click');
            const scenario = state.stage4Questions[state.stage4CurrentIdx];
            const opt = scenario.options[optIdx];

            addScore(opt.score);

            showModal("의사결정 완료", `${opt.note}`, "success");

            state.stage4CurrentIdx++;

            if (state.stage4CurrentIdx < state.stage4Questions.length) {
                setTimeout(() => renderStage4(document.getElementById('stage-canvas')), 1000);
            } else {
                setTimeout(() => completeGame(), 1000);
            }
        }

        // ==========================================
        // COMPLETION VIEW & RESTART/MASTER CHALLENGE
        // ==========================================
        function completeGame() {
            clearInterval(state.timerInterval);
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            playSound('levelup');

            document.getElementById('stage-canvas').classList.add('hidden');
            document.getElementById('main-footer').classList.add('hidden');

            const resultView = document.getElementById('view-result');
            resultView.classList.remove('hidden');

            const totalTimeSec = state.elapsedSeconds;
            const mins = Math.floor(totalTimeSec / 60);
            const secs = totalTimeSec % 60;

            resultView.innerHTML = `
                <div class="w-full max-w-2xl bg-white/90 rounded-3xl p-8 border border-emerald-200 shadow-2xl backdrop-blur-md text-center space-y-4">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full text-4xl shadow-inner">
                        <i class="fa-solid fa-award"></i>
                    </div>

                    <div>
                        <span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold uppercase">Quest Completed</span>
                        <h2 class="text-2xl font-black text-slate-800 mt-2">
                            ${state.isMasterMode ? '🔥 마스터 모드 완전 정복!' : '🎉 생명기술 미션 완전 정복!'}
                        </h2>
                        <p class="text-xs text-slate-500 mt-1">지속가능한 미래를 이끌어갈 우수 미래 생명공학 인재 리포트입니다.</p>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 grid grid-cols-3 gap-3 text-center">
                        <div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase">탐구 학생</div>
                            <div class="text-sm font-bold text-slate-800 mt-0.5">${state.player.name}</div>
                            <div class="text-[10px] text-emerald-600">${state.player.classInfo}</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase">최종 에코 스코어</div>
                            <div class="text-xl font-black text-amber-500 mt-0.5">${state.score}점</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase">소요 시간</div>
                            <div class="text-sm font-bold text-slate-800 mt-0.5">${mins}분 ${secs}초</div>
                        </div>
                    </div>

                    <div class="p-3 bg-emerald-50 text-emerald-900 rounded-xl text-left text-xs leading-relaxed border border-emerald-100">
                        <i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i>
                        <b>핵심 기술 성취:</b> 전통/현대 생명기술의 차이를 이해하고, 스마트팜 ICT 환경 제어와 바이오에탄올 탄소중립 순환 체계 및 SDGs 윤리적 가치를 습득했습니다.
                    </div>

                    <!-- Dual Challenge Buttons -->
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button onclick="restartGame(false)" class="touch-btn py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-2 border border-slate-300">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>처음부터 도전하기</span>
                        </button>

                        <button onclick="restartGame(true)" class="touch-btn py-3.5 bg-gradient-to-r from-amber-500 to-emerald-600 hover:from-amber-600 hover:to-emerald-700 text-white font-bold rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
                            <i class="fa-solid fa-fire"></i>
                            <span>🔥 더 높은 난이도 도전하기</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function restartGame(masterMode = false) {
            playSound('click');
            state.score = 0;
            state.combo = 0;
            state.currentStage = 1;
            state.stage4CurrentIdx = 0;
            state.isMasterMode = masterMode;

            const diffTag = document.getElementById('difficulty-tag');
            if (masterMode) {
                diffTag.classList.remove('hidden');
            } else {
                diffTag.classList.add('hidden');
            }

            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('stage-canvas').classList.remove('hidden');
            document.getElementById('main-footer').classList.remove('hidden');

            document.getElementById('score-display').innerText = '0';
            document.getElementById('combo-display').innerText = '0x';

            initData();
            startTimer();
            loadStage(1);
        }

        function showModal(title, bodyText, type = "info") {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('modal-card');
            const iconEl = document.getElementById('modal-icon');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');

            titleEl.innerText = title;
            bodyEl.innerHTML = bodyText;

            if (type === "success") {
                iconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-emerald-100 text-emerald-600";
                iconEl.innerHTML = `<i class="fa-solid fa-check"></i>`;
            } else if (type === "error") {
                iconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-red-100 text-red-600";
                iconEl.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
            } else {
                iconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-blue-100 text-blue-600";
                iconEl.innerHTML = `<i class="fa-solid fa-circle-info"></i>`;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            playSound('click');
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('modal-card');

            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }
    </script>
</body>
</html>
